[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Opciones por defecto:
#   --tb=short     → Tracebacks cortos para legibilidad
#   -v             → Modo verbose (ver cada test individual)
#   --cov=core     → Cobertura del directorio core/
#   --cov=utils    → Cobertura del directorio utils/
#   --cov-report   → Reporte en terminal con líneas faltantes
#   --cov-fail-under=80 → Fallo si cobertura < 80%
addopts = --tb=short -v --cov=core --cov=utils --cov-report=term-missing --cov-fail-under=50

# Marcadores personalizados
markers =
    slow: Pruebas que toman más de 5 segundos
    integration: Pruebas de integración que requieren dependencias externas
